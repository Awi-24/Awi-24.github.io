name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # Agamoto (agamoto.awi-24.dev/agamoto ou awi-24.github.io/agamoto): repositório separado
      # e privado (Awi-24/agamoto), com seu próprio SQLite versionado. O código-fonte fica lá,
      # aqui só o HTML já exportado entra no artefato do Pages — nunca no histórico deste repo.
      # Precisa do secret AGAMOTO_PAT (fine-grained PAT, só leitura, escopo repositório
      # Awi-24/agamoto) porque o GITHUB_TOKEN padrão não enxerga outro repositório privado.
      - name: Checkout Agamoto
        if: ${{ vars.AGAMOTO_ENABLED == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: Awi-24/agamoto
          token: ${{ secrets.AGAMOTO_PAT }}
          path: agamoto-src

      - name: Build Agamoto (export estático)
        if: ${{ vars.AGAMOTO_ENABLED == 'true' }}
        working-directory: agamoto-src/web
        run: |
          npm ci
          npm run build:static

      - name: Mesclar Agamoto no build
        if: ${{ vars.AGAMOTO_ENABLED == 'true' }}
        run: |
          mkdir -p out/agamoto
          cp -r agamoto-src/web/out/. out/agamoto/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
